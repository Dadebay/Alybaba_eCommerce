name: nabelli_ecommerce
version: 1.4.3+17
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  cached_network_image: any
  carousel_slider: ^5.1.1
  cupertino_icons: ^1.0.2
 
  flutter:
    sdk: flutter
  flutter_iconly: ^1.0.2
  permission_handler: ^11.0.1
  get: ^4.6.6
  get_storage: ^2.1.1
  http: any
  lottie: ^3.0.0
  pull_to_refresh: ^2.0.0
  share: any
  restart_app: ^1.3.2
  url_launcher: ^6.1.11
  photo_view: ^0.14.0
  firebase_core: ^3.13.1
  firebase_core_platform_interface: ^6.0.0
  firebase_messaging: ^15.2.6
  # firebase_analytics: ^11.6.0
  flutter_local_notifications: ^19.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/lottie/
    - assets/image/

  fonts:
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: GilroySemiBold
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
    - family: GilroyMedium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
  uses-material-design: true
  generate: true
