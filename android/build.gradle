buildscript {
    // Belirttiğiniz Kotlin sürümü korunuyor.
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Belirttiğiniz Android Gradle Plugin sürümü korunuyor.
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ===================================================================
// ** HATA DÜZELTMESİ **
// Bu blok, projenizdeki tüm alt modüllerin (hem uygulamanızın hem de
// bağımlılıkların) Java 1.8'i hedeflemesini sağlayarak JVM uyumluluk
// hatasını çözer.
// ===================================================================
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Namespace için eklediğiniz kod burada korunuyor.
                if (namespace == null) {
                    namespace project.group
                }

                // Java ve Kotlin derleyici seçenekleri tüm modüller için burada ayarlanıyor.
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }

                project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                    kotlinOptions {
                        jvmTarget = "1.8"
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
